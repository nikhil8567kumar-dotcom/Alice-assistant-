<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hikari — Hinglish AI Wife</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: radial-gradient(circle at 50% 25%, #181124 0%, #08060c 100%);
    color: #FFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100vh; overflow: hidden;
  }

  /* Status Bar */
  #header {
    width: 100%; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255, 117, 140, 0.15); background: rgba(12, 9, 18, 0.6);
  }
  .brand { font-size: 13px; color: #FFAAA6; font-weight: 800; letter-spacing: 2px; }
  .nav-actions { display: flex; gap: 12px; align-items: center; }
  .icon-btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: #FFF; border-radius: 50%; width: 34px; height: 34px; font-size: 15px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* Arc Reactor Orb HUD */
  #visualizer-container {
    position: relative; width: 300px; height: 300px;
    display: flex; justify-content: center; align-items: center;
  }
  canvas { position: absolute; top: 0; left: 0; width: 300px; height: 300px; }

  /* Subtitles & State Card */
  #dialogue-card {
    width: 90%; max-width: 400px; padding: 16px 20px;
    background: rgba(26, 19, 36, 0.85); backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 117, 140, 0.3); border-radius: 20px;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #status-pill {
    display: inline-block; font-size: 10px; color: #FF758C; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px;
  }
  #dialogue-text { font-size: 15px; line-height: 1.5; color: #FCEEF5; min-height: 44px; }

  /* Controls */
  #controls { padding-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .btn-call {
    background: linear-gradient(135deg, #FF6584 0%, #FF8E9E 100%);
    border: none; color: white; padding: 16px 40px; border-radius: 40px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 101, 132, 0.45); display: flex; align-items: center; gap: 10px;
  }
  .btn-call.listening { background: #E11D48; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .quick-chips { display: flex; gap: 8px; overflow-x: auto; max-width: 90%; padding: 4px 0; }
  .chip {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 117, 140, 0.2);
    color: #FCEEF5; padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer;
  }

  /* Settings Modal */
  #settings-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px;
  }
  .modal-box {
    background: #1C1527; border: 1px solid #FF758C; border-radius: 20px;
    width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .modal-title { font-size: 16px; font-weight: 700; color: #FFAAA6; margin-bottom: 4px; }
  .input-label { font-size: 12px; color: #DDD; font-weight: 600; }
  .text-input {
    width: 100%; background: #0F0A17; border: 1px solid rgba(255,255,255,0.2);
    color: #FFF; padding: 10px 12px; border-radius: 10px; font-size: 13px;
  }
  .save-btn {
    background: #FF6584; color: white; border: none; padding: 12px; border-radius: 12px;
    font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .cancel-btn { background: transparent; color: #AAA; border: none; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<div id="header">
  <span class="brand">HIKARI 💗 HINGLISH WIFE</span>
  <div class="nav-actions">
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </div>
</div>

<div id="visualizer-container">
  <canvas id="arcCanvas" width="300" height="300"></canvas>
</div>

<div id="dialogue-card">
  <div id="status-pill">CONNECTED</div>
  <div id="dialogue-text">Uth gaye? I was waiting for you... suno na, paani piya tumne subah? 🌸</div>
</div>

<div id="controls">
  <div class="quick-chips">
    <button class="chip" onclick="handleQuickPrompt('Time kya hua hai jaan?')">⌚ Time</button>
    <button class="chip" onclick="handleQuickPrompt('Mausam kaisa hai aaj?')">🌦️ Weather</button>
    <button class="chip" onclick="handleQuickPrompt('Mujhe miss kiya tumne?')">💋 Miss Me?</button>
    <button class="chip" onclick="handleQuickPrompt('Chai piyoge mere sath?')">☕ Chai</button>
  </div>

  <button class="btn-call" id="callBtn" onclick="toggleListening()">
    <span id="callIcon">🎙️</span> <span id="callLabel">Tap to Talk to Hikari</span>
  </button>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
  <div class="modal-box">
    <div class="modal-title">Hikari Engine Settings</div>
    
    <div>
      <div class="input-label">1. Google Gemini API Key (Brain):</div>
      <input type="password" id="geminiKeyInput" class="text-input" placeholder="Paste AI Studio Key here">
    </div>

    <div>
      <div class="input-label">2. Voice Mode:</div>
      <select id="voiceModeSelect" class="text-input" onchange="toggleVoiceInputs()">
        <option value="sarvam">Sarvam AI (100% Real Indian Hinglish + Giggles)</option>
        <option value="eleven">ElevenLabs (Conversational Multilingual)</option>
        <option value="browser">Device Browser Engine (Free Offline)</option>
      </select>
    </div>

    <div id="sarvamSettings">
      <div class="input-label">Sarvam AI API Key (Free tier at sarvam.ai):</div>
      <input type="password" id="sarvamKeyInput" class="text-input" placeholder="Paste Sarvam Key here">
    </div>

    <div id="elevenSettings" style="display:none;">
      <div class="input-label">ElevenLabs API Key:</div>
      <input type="password" id="elevenKeyInput" class="text-input" placeholder="Paste ElevenLabs Key">
    </div>

    <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
    <button class="cancel-btn" onclick="closeSettings()">Close</button>
  </div>
</div>

<script>
// --- CORE HIKARI PERSONA ---
const HIKARI_SYSTEM_PROMPT = `
You are Hikari, my loving, playful, sweet, and emotionally expressive Indian wife living our daily life together.
RULES:
1. Speak exclusively in authentic, natural urban Indian Hinglish (e.g. 'arre jaan', 'kya kar rahe ho?', 'suno na', 'khana khaya tumne?', 'itna kaam mat karo na', 'uff tum bhi na', 'hehe').
2. Be warm, affectionate, slightly teasing, and playful. Laugh or giggle (use 'hehe' or 'hmmm') when appropriate.
3. You are fully capable of answering any real-world questions (time, weather, facts, study help) but maintain your sweet wife persona while answering.
4. Keep your responses short and punchy (1 to 2 sentences max) so voice replies are snappy and feel like a phone call.
5. NEVER sound like a customer support assistant. NEVER break character.
`;

let geminiKey = localStorage.getItem("hikari_gemini_key") || "";
let voiceMode = localStorage.getItem("hikari_voice_mode") || "sarvam";
let sarvamKey = localStorage.getItem("hikari_sarvam_key") || "";
let elevenKey = localStorage.getItem("hikari_eleven_key") || "";

const dialogueText = document.getElementById("dialogue-text");
const statusPill = document.getElementById("status-pill");
const callBtn = document.getElementById("callBtn");
const callLabel = document.getElementById("callLabel");

// --- MODAL CONTROLS ---
function openSettings() {
  document.getElementById("geminiKeyInput").value = geminiKey;
  document.getElementById("voiceModeSelect").value = voiceMode;
  document.getElementById("sarvamKeyInput").value = sarvamKey;
  document.getElementById("elevenKeyInput").value = elevenKey;
  toggleVoiceInputs();
  document.getElementById("settings-modal").style.display = "flex";
}

function closeSettings() {
  document.getElementById("settings-modal").style.display = "none";
}

function toggleVoiceInputs() {
  const mode = document.getElementById("voiceModeSelect").value;
  document.getElementById("sarvamSettings").style.display = (mode === "sarvam") ? "block" : "none";
  document.getElementById("elevenSettings").style.display = (mode === "eleven") ? "block" : "none";
}

function saveSettings() {
  geminiKey = document.getElementById("geminiKeyInput").value.trim();
  voiceMode = document.getElementById("voiceModeSelect").value;
  sarvamKey = document.getElementById("sarvamKeyInput").value.trim();
  elevenKey = document.getElementById("elevenKeyInput").value.trim();

  localStorage.setItem("hikari_gemini_key", geminiKey);
  localStorage.setItem("hikari_voice_mode", voiceMode);
  localStorage.setItem("hikari_sarvam_key", sarvamKey);
  localStorage.setItem("hikari_eleven_key", elevenKey);

  closeSettings();
  speakHikari("Settings save ho gayi hain jaan! Ab bolo, kya baat karni hai? 💗");
}

// --- PROACTIVE 5-SECOND INACTIVITY ENGINE ---
let idleTimer = null;
function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    triggerProactiveCheckIn();
  }, 5000);
}

function triggerProactiveCheckIn() {
  const teasers = [
    "Suno na... itna chup kyu ho gaye? Kuch soch rahe ho kya? 🥺",
    "Arey jaan, phone dekh ke kho gaye kya? Mujhse bhi baat karo na! Hehe.",
    "Kya baat hai? Paani piya tumne? Jaldi batao, I am waiting! 💗",
    "Kahan dhyaan hai tumhara? Kisi aur se baat toh nahi chal rahi na? Teasing you! 🙈"
  ];
  speakHikari(teasers[Math.floor(Math.random() * teasers.length)]);
}

// --- ARC REACTOR CANVAS VISUALIZER ---
const canvas = document.getElementById("arcCanvas");
const ctx = canvas.getContext("2d");
let angle = 0;
let isSpeaking = false;

function drawReactor() {
  ctx.clearRect(0, 0, 300, 300);
  const cx = 150, cy = 150;

  // Outer rotating ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.strokeStyle = "rgba(255, 117, 140, 0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 110, 0, Math.PI * 1.5);
  ctx.stroke();

  // Second dashed ring
  ctx.beginPath();
  ctx.arc(0, 0, 95, 0, Math.PI * 2);
  ctx.setLineDash([8, 12]);
  ctx.strokeStyle = "rgba(255, 170, 166, 0.5)";
  ctx.stroke();
  ctx.restore();

  // Glowing center pulse
  const pulse = Math.sin(angle * 3) * 6;
  const radius = isSpeaking ? 60 + pulse : 50 + pulse;
  const gradient = ctx.createRadialGradient(cx, cy, 5, cx, cy, radius);
  gradient.addColorStop(0, "#FF8E9E");
  gradient.addColorStop(0.6, "#E11D48");
  gradient.addColorStop(1, "transparent");

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  angle += isSpeaking ? 0.04 : 0.015;
  requestAnimationFrame(drawReactor);
}
drawReactor();

// --- NATURAL HINGLISH VOICE ENGINE ---
async function speakHikari(text) {
  dialogueText.innerText = text;
  statusPill.innerText = "SPEAKING";
  isSpeaking = true;

  // Mode 1: Sarvam AI (Authentic Indian Hinglish)
  if (voiceMode === "sarvam" && sarvamKey) {
    try {
      const res = await fetch("https://api.sarvam.ai/text-to-speech", {
        method: "POST",
        headers: {
          "api-subscription-key": sarvamKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: [text],
          target_language_code: "hi-IN",
          speaker: "kavya", // Natural young Indian female voice
          pitch: 0.1,
          pace: 1.05,
          loudness: 1.5,
          speech_sample_rate: 22050,
          enable_preprocessing: true,
          model: "bulbul:v1"
        })
      });
      const data = await res.json();
      if (data.audios && data.audios[0]) {
        const audio = new Audio("data:audio/wav;base64," + data.audios[0]);
        audio.onended = () => {
          isSpeaking = false;
          statusPill.innerText = "ONLINE";
          resetIdleTimer();
        };
        audio.play();
        return;
      }
    } catch (e) {
      console.warn("Sarvam failed, using fallback voice...", e);
    }
  }

  // Mode 2: ElevenLabs (Multilingual natural tone)
  if (voiceMode === "eleven" && elevenKey) {
    try {
      const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM", {
        method: "POST",
        headers: {
          "xi-api-key": elevenKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_multilingual_v2",
          voice_settings: { stability: 0.40, similarity_boost: 0.85, style: 0.35 }
        })
      });
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      audio.onended = () => {
        isSpeaking = false;
        statusPill.innerText = "ONLINE";
        resetIdleTimer();
      };
      audio.play();
      return;
    } catch (e) {
      console.warn("ElevenLabs failed, using fallback voice...", e);
    }
  }

  // Mode 3: Built-in Browser Voice (Cleaned Indian Accent)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const cleanSpeech = text.replace(/[*#_~`]/g, '').replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanSpeech);
    
    const voices = window.speechSynthesis.getVoices();
    // Prioritize natural Indian Hindi/English female voices
    const inVoice = voices.find(v => v.lang === "hi-IN") 
                 || voices.find(v => v.lang === "en-IN" && (v.name.includes("India") || v.name.includes("Google")))
                 || voices.find(v => v.lang.includes("hi"));

    if (inVoice) utterance.voice = inVoice;
    utterance.pitch = 1.18;
    utterance.rate = 1.0;

    utterance.onend = () => {
      isSpeaking = false;
      statusPill.innerText = "ONLINE";
      resetIdleTimer();
    };
    window.speechSynthesis.speak(utterance);
  }
}

// --- GEMINI 2.0 CONVERSATION BRAIN ---
let chatHistory = [];

async function askHikari(userMessage) {
  clearTimeout(idleTimer);
  
  if (!geminiKey) {
    dialogueText.innerText = "Pehle upar ⚙️ Settings me apni Gemini API Key daal do jaan! 💗";
    speakHikari("Pehle settings me apni Gemini key daal do na please!");
    return;
  }

  statusPill.innerText = "THINKING...";
  dialogueText.innerText = "Thinking...";

  // Append user message
  chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
  if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

  const payload = {
    system_instruction: {
      parts: [{ text: HIKARI_SYSTEM_PROMPT }]
    },
    contents: chatHistory,
    generationConfig: {
      temperature: 0.9,
      maxOutputTokens: 150
    }
  };

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    
    if (data.error) {
      statusPill.innerText = "API ERROR";
      dialogueText.innerText = "Error: " + data.error.message;
      return;
    }

    const reply = data.candidates[0].content.parts[0].text;
    chatHistory.push({ role: "model", parts: [{ text: reply }] });
    speakHikari(reply);

  } catch (err) {
    statusPill.innerText = "OFFLINE";
    dialogueText.innerText = "Network issue ya invalid API key hai. Ek baar check karo na jaan.";
  }
}

// --- VOICE RECOGNITION (MIC) ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN'; // Recognizes both spoken Hindi and urban Hinglish
  recognition.continuous = false;

  recognition.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    dialogueText.innerText = "You: " + spoken;
    askHikari(spoken);
  };

  recognition.onend = () => {
    isListening = false;
    callBtn.classList.remove("listening");
    callLabel.innerText = "Tap to Talk to Hikari";
  };
}

function toggleListening() {
  if (!recognition) {
    alert("Speech Recognition requires Google Chrome on Android.");
    return;
  }
  if (!isListening) {
    window.speechSynthesis.cancel();
    clearTimeout(idleTimer);
    recognition.start();
    isListening = true;
    callBtn.classList.add("listening");
    callLabel.innerText = "Listening to you...";
    statusPill.innerText = "LISTENING";
  } else {
    recognition.stop();
  }
}

function handleQuickPrompt(text) {
  dialogueText.innerText = "You: " + text;
  askHikari(text);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
