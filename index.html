<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hikari — JARVIS Hinglish Companion</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: radial-gradient(circle at 50% 25%, #181124 0%, #08060c 100%);
    color: #FFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100vh; overflow: hidden;
  }

  /* Status Bar */
  #header {
    width: 100%; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255, 117, 140, 0.15); background: rgba(12, 9, 18, 0.6);
  }
  .brand { font-size: 13px; color: #FFAAA6; font-weight: 800; letter-spacing: 2px; }
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: #FFF; border-radius: 50%; width: 34px; height: 34px; font-size: 15px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* Arc Reactor Orb HUD */
  #visualizer-container {
    position: relative; width: 280px; height: 280px;
    display: flex; justify-content: center; align-items: center;
  }
  canvas { position: absolute; top: 0; left: 0; width: 280px; height: 280px; }

  /* Subtitles & State Card */
  #dialogue-card {
    width: 90%; max-width: 400px; padding: 16px 20px;
    background: rgba(26, 19, 36, 0.85); backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 117, 140, 0.3); border-radius: 20px;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #status-pill {
    display: inline-block; font-size: 10px; color: #FF758C; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px;
  }
  #dialogue-text { font-size: 15px; line-height: 1.5; color: #FCEEF5; min-height: 44px; word-break: break-word; }

  /* Controls */
  #controls { padding-bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  
  .handsfree-toggle {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #AAA; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.3s ease;
  }
  .handsfree-toggle.active {
    background: rgba(74, 222, 128, 0.15); border-color: #4ADE80; color: #4ADE80;
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
  }

  .btn-call {
    background: linear-gradient(135deg, #FF6584 0%, #FF8E9E 100%);
    border: none; color: white; padding: 15px 36px; border-radius: 40px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 101, 132, 0.45); display: flex; align-items: center; gap: 10px;
  }
  .btn-call.listening { background: #E11D48; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .quick-chips { display: flex; gap: 8px; overflow-x: auto; max-width: 90%; padding: 4px 0; }
  .chip {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 117, 140, 0.2);
    color: #FCEEF5; padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer;
  }

  /* Settings Modal */
  #settings-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px;
  }
  .modal-box {
    background: #1C1527; border: 1px solid #FF758C; border-radius: 20px;
    width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .modal-title { font-size: 16px; font-weight: 700; color: #FFAAA6; }
  .input-label { font-size: 12px; color: #DDD; font-weight: 600; margin-bottom: 4px; }
  .text-input {
    width: 100%; background: #0F0A17; border: 1px solid rgba(255,255,255,0.2);
    color: #FFF; padding: 10px 12px; border-radius: 10px; font-size: 13px;
  }
  .save-btn {
    background: #FF6584; color: white; border: none; padding: 12px; border-radius: 12px;
    font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .cancel-btn { background: transparent; color: #AAA; border: none; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<div id="header">
  <span class="brand">HIKARI 💗 HINGLISH WIFE</span>
  <div class="nav-actions">
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </div>
</div>

<div id="visualizer-container">
  <canvas id="arcCanvas" width="280" height="280"></canvas>
</div>

<div id="dialogue-card">
  <div id="status-pill">ONLINE</div>
  <div id="dialogue-text">Uth gaye? I was waiting for you... suno na, paani piya tumne? 🌸</div>
</div>

<div id="controls">
  <button id="handsfreeBtn" class="handsfree-toggle" onclick="toggleHandsFree()">
    <span>🎙️</span> <span id="hfText">Hands-Free Call: OFF</span>
  </button>

  <div class="quick-chips">
    <button class="chip" onclick="handleQuickPrompt('Time kya hua hai jaan?')">⌚ Time</button>
    <button class="chip" onclick="handleQuickPrompt('Mausam kaisa hai aaj?')">🌦️ Weather</button>
    <button class="chip" onclick="handleQuickPrompt('Mujhe miss kiya tumne?')">💋 Miss Me?</button>
    <button class="chip" onclick="handleQuickPrompt('Chai piyoge mere sath?')">☕ Chai</button>
  </div>

  <button class="btn-call" id="callBtn" onclick="toggleListening()">
    <span id="callIcon">🎙️</span> <span id="callLabel">Tap to Talk to Hikari</span>
  </button>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
  <div class="modal-box">
    <div class="modal-title">Hikari Engine Settings</div>
    
    <div>
      <div class="input-label">1. Google Gemini API Key:</div>
      <input type="password" id="geminiKeyInput" class="text-input" placeholder="Paste AI Studio Key">
    </div>

    <div>
      <div class="input-label">2. Voice Mode:</div>
      <select id="voiceModeSelect" class="text-input" onchange="toggleVoiceInputs()">
        <option value="sarvam">Sarvam AI (Native Indian Girl Accent + Giggles)</option>
        <option value="browser">Device Browser Engine (Free Offline)</option>
      </select>
    </div>

    <div id="sarvamSettings">
      <div class="input-label">Sarvam API Key (from sarvam.ai):</div>
      <input type="password" id="sarvamKeyInput" class="text-input" placeholder="Paste Sarvam Key">
    </div>

    <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
    <button class="cancel-btn" onclick="closeSettings()">Close</button>
  </div>
</div>

<script>
const HIKARI_SYSTEM_PROMPT = `
You are Hikari, my loving, playful, sweet, and emotionally expressive Indian wife living our daily life together.
RULES:
1. Speak exclusively in authentic, natural urban Indian Hinglish (e.g. 'arre jaan', 'kya kar rahe ho?', 'suno na', 'khana khaya tumne?', 'itna kaam mat karo na', 'uff tum bhi na', 'hehe').
2. Be warm, affectionate, slightly teasing, and playful. Laugh or giggle (use 'hehe' or 'hmmm') when appropriate.
3. Keep replies very brief (1 to 2 short sentences max) so that voice synthesis feels immediate like a phone call.
4. You answer questions directly (time, weather, everyday queries) while maintaining your sweet wife persona.
5. NEVER sound like a corporate robot.
`;

let geminiKey = localStorage.getItem("hikari_gemini_key") || "";
let voiceMode = localStorage.getItem("hikari_voice_mode") || "sarvam";
let sarvamKey = localStorage.getItem("hikari_sarvam_key") || "";
let isHandsFree = false;

const dialogueText = document.getElementById("dialogue-text");
const statusPill = document.getElementById("status-pill");
const callBtn = document.getElementById("callBtn");
const callLabel = document.getElementById("callLabel");
const handsfreeBtn = document.getElementById("handsfreeBtn");
const hfText = document.getElementById("hfText");

function openSettings() {
  document.getElementById("geminiKeyInput").value = geminiKey;
  document.getElementById("voiceModeSelect").value = voiceMode;
  document.getElementById("sarvamKeyInput").value = sarvamKey;
  toggleVoiceInputs();
  document.getElementById("settings-modal").style.display = "flex";
}

function closeSettings() {
  document.getElementById("settings-modal").style.display = "none";
}

function toggleVoiceInputs() {
  const mode = document.getElementById("voiceModeSelect").value;
  document.getElementById("sarvamSettings").style.display = (mode === "sarvam") ? "block" : "none";
}

function saveSettings() {
  geminiKey = document.getElementById("geminiKeyInput").value.trim();
  voiceMode = document.getElementById("voiceModeSelect").value;
  sarvamKey = document.getElementById("sarvamKeyInput").value.trim();

  localStorage.setItem("hikari_gemini_key", geminiKey);
  localStorage.setItem("hikari_voice_mode", voiceMode);
  localStorage.setItem("hikari_sarvam_key", sarvamKey);

  closeSettings();
  speakHikari("Settings save ho gayi hain jaan! Ab baat karte hain, hehe. 💗");
}

function toggleHandsFree() {
  isHandsFree = !isHandsFree;
  if (isHandsFree) {
    handsfreeBtn.classList.add("active");
    hfText.innerText = "Hands-Free Call: ON 🟢";
    if (!isListening && !isSpeaking) {
      startListeningLoop();
    }
  } else {
    handsfreeBtn.classList.remove("active");
    hfText.innerText = "Hands-Free Call: OFF";
    if (isListening) recognition.stop();
  }
}

// Visualizer Canvas
const canvas = document.getElementById("arcCanvas");
const ctx = canvas.getContext("2d");
let angle = 0;
let isSpeaking = false;

function drawReactor() {
  ctx.clearRect(0, 0, 280, 280);
  const cx = 140, cy = 140;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.strokeStyle = "rgba(255, 117, 140, 0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 100, 0, Math.PI * 1.5);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, 85, 0, Math.PI * 2);
  ctx.setLineDash([8, 12]);
  ctx.strokeStyle = "rgba(255, 170, 166, 0.5)";
  ctx.stroke();
  ctx.restore();

  const pulse = Math.sin(angle * 3) * 6;
  const radius = isSpeaking ? 58 + pulse : 46 + pulse;
  const gradient = ctx.createRadialGradient(cx, cy, 5, cx, cy, radius);
  gradient.addColorStop(0, "#FF8E9E");
  gradient.addColorStop(0.6, "#E11D48");
  gradient.addColorStop(1, "transparent");

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  angle += isSpeaking ? 0.04 : 0.015;
  requestAnimationFrame(drawReactor);
}
drawReactor();

// Multi-Engine Voice Synthesizer
let currentAudio = null;

async function speakHikari(text) {
  dialogueText.innerText = text;
  statusPill.innerText = "SPEAKING";
  isSpeaking = true;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  // 1. Sarvam AI Engine (Authentic Indian Hinglish)
  if (voiceMode === "sarvam" && sarvamKey) {
    try {
      const res = await fetch("https://api.sarvam.ai/text-to-speech", {
        method: "POST",
        headers: {
          "api-subscription-key": sarvamKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: [text],
          target_language_code: "hi-IN",
          speaker: "kavya",
          model: "bulbul:v1",
          enable_preprocessing: true
        })
      });

      const data = await res.json();
      if (data.audios && data.audios[0]) {
        currentAudio = new Audio("data:audio/wav;base64," + data.audios[0]);
        currentAudio.onended = () => finishSpeaking();
        currentAudio.onerror = () => fallbackDeviceTTS(text);
        await currentAudio.play();
        return;
      }
    } catch (e) {
      console.warn("Sarvam error, dropping to fallback TTS", e);
    }
  }

  // 2. Fallback Browser TTS
  fallbackDeviceTTS(text);
}

function fallbackDeviceTTS(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const cleanSpeech = text.replace(/[*#_~`]/g, '').replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanSpeech);
    
    const voices = window.speechSynthesis.getVoices();
    const inVoice = voices.find(v => v.lang === "hi-IN") 
                 || voices.find(v => v.lang === "en-IN" && (v.name.includes("India") || v.name.includes("Google")))
                 || voices.find(v => v.lang.includes("hi"));

    if (inVoice) utterance.voice = inVoice;
    utterance.pitch = 1.18;
    utterance.rate = 1.0;

    utterance.onend = () => finishSpeaking();
    utterance.onerror = () => finishSpeaking();
    window.speechSynthesis.speak(utterance);
  } else {
    finishSpeaking();
  }
}

function finishSpeaking() {
  isSpeaking = false;
  statusPill.innerText = "ONLINE";
  if (isHandsFree) {
    setTimeout(() => startListeningLoop(), 400);
  }
}

// Conversation Processing Engine (Auto-Resolves Gemini Model & Endpoint)
let chatHistory = [];

async function askHikari(userMessage) {
  if (!geminiKey) {
    dialogueText.innerText = "Pehle upar ⚙️ Settings me apni Gemini API Key daal do jaan! 💗";
    speakHikari("Pehle settings me apni Gemini key save kar lo please!");
    return;
  }

  statusPill.innerText = "THINKING...";
  dialogueText.innerText = "Thinking...";

  chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
  if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

  const payload = {
    contents: chatHistory,
    systemInstruction: {
      parts: [{ text: HIKARI_SYSTEM_PROMPT }]
    },
    generationConfig: {
      temperature: 0.85,
      maxOutputTokens: 140
    }
  };

  // Self-healing endpoint list: tries modern flash models in order
  const endpoints = [
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
    `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${geminiKey}`,
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${geminiKey}`
  ];

  let reply = null;
  let lastError = null;

  for (const url of endpoints) {
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        reply = data.candidates[0].content.parts[0].text;
        break;
      } else if (data.error) {
        lastError = data.error.message;
      }
    } catch (e) {
      lastError = e.message;
    }
  }

  if (reply) {
    chatHistory.push({ role: "model", parts: [{ text: reply }] });
    speakHikari(reply);
  } else {
    statusPill.innerText = "API ERROR";
    dialogueText.innerText = "Error: " + (lastError || "Could not connect to Gemini.");
  }
}

// Voice Recognition
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.continuous = false;

  recognition.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    dialogueText.innerText = "You: " + spoken;
    askHikari(spoken);
  };

  recognition.onend = () => {
    isListening = false;
    callBtn.classList.remove("listening");
    callLabel.innerText = isHandsFree ? "Hands-Free Active..." : "Tap to Talk to Hikari";
    if (isHandsFree && !isSpeaking) {
      setTimeout(() => startListeningLoop(), 600);
    }
  };

  recognition.onerror = () => {
    isListening = false;
    callBtn.classList.remove("listening");
    if (isHandsFree && !isSpeaking) {
      setTimeout(() => startListeningLoop(), 1000);
    }
  };
}

function startListeningLoop() {
  if (!recognition || isListening || isSpeaking) return;
  try {
    recognition.start();
    isListening = true;
    callBtn.classList.add("listening");
    callLabel.innerText = "Listening to you...";
    statusPill.innerText = "LISTENING";
  } catch (e) {}
}

function toggleListening() {
  if (!recognition) {
    alert("Speech recognition requires Google Chrome on Android.");
    return;
  }
  if (!isListening) {
    if (currentAudio) currentAudio.pause();
    window.speechSynthesis.cancel();
    startListeningLoop();
  } else {
    recognition.stop();
  }
}

function handleQuickPrompt(text) {
  dialogueText.innerText = "You: " + text;
  askHikari(text);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
